<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openP6 — awaiting approval</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="loginpage">
  <div class="logincard">
    <div class="logobig">open<b>P6</b></div>
    <p class="sub">Access requested</p>
    <p class="pendingmsg">
      Your request has been sent to the administrator. You'll be able to open your
      schedules as soon as it's approved &mdash; <b>no need to sign in again</b>.
    </p>
    <p class="hint" id="who"></p>
    <button id="refresh" class="gbtn">Check again</button>
    <p class="hint" id="status">Checking automatically every 15 seconds.</p>
    <button id="signout" class="plain">Sign out</button>
    <div class="err" id="err"></div>
  </div>

  <script>
    const err = document.getElementById('err');
    const status = document.getElementById('status');
    let busy = false;

    const stamp = () => new Date().toLocaleTimeString();

    async function check(manual){
      if (busy) return;
      busy = true;
      if (manual) status.textContent = 'Checking\u2026';
      try {
        const r = await fetch('/api/me', {cache: 'no-store'});
        if (!r.ok) { location.href = '/login'; return; }
        const u = await r.json();
        document.getElementById('who').textContent = u.email || '';
        if (u.admin || u.status === 'approved') {      // approved: go straight in
          status.textContent = 'Approved \u2014 opening openP6\u2026';
          location.href = '/';
          return;
        }
        if (u.status === 'revoked') {
          err.textContent = 'Access was revoked by the administrator.';
          status.textContent = '';
          return;
        }
        status.textContent = 'Still waiting for approval \u2014 last checked ' + stamp() + '.';
      } catch (e) {
        status.textContent = 'Could not reach the server \u2014 retrying\u2026';
      } finally {
        busy = false;
      }
    }

    document.getElementById('refresh').addEventListener('click', () => check(true));
    document.getElementById('signout').addEventListener('click', async () => {
      try { await fetch('/api/logout', {method: 'POST'}); } catch (e) {}
      location.href = '/login';
    });

    check(false);
    setInterval(() => check(false), 15000);
  </script>
</body>
</html>
