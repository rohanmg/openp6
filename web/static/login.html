<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openP6 — sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="loginpage">
  <div class="logincard">
    <div class="logobig">open<b>P6</b></div>
    <p class="sub">Primavera&nbsp;P6–style scheduling, on the web.</p>

    <a class="gbtn" href="/auth/google/login">
      <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.6c0-1.6-.2-3.2-.5-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.6 5.9c4.4-4.1 6.7-10.1 6.7-17.3z"/>
        <path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.4 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>
    <p class="hint">New accounts are reviewed by the administrator before they can open schedules.</p>

    <details class="pwfold">
      <summary>Admin password</summary>
      <form id="loginform">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>
    </details>

    <div class="err" id="err"></div>
  </div>

  <script>
    const err = document.getElementById('err');
    const q = new URLSearchParams(location.search);
    if (q.get('error')) err.textContent = 'Sign-in failed: ' + q.get('error');

    document.getElementById('loginform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: document.getElementById('pw').value})
      });
      if (r.ok) { location.href = '/'; } else { err.textContent = 'Wrong password'; }
    });
  </script>
</body>
</html>
