<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openP6 — sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="loginpage">
  <form class="logincard" id="loginform">
    <div class="logobig">open<b>P6</b></div>
    <p class="sub">Primavera&nbsp;P6–style scheduling, on the web.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const f = document.getElementById('loginform');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: document.getElementById('pw').value})
      });
      if (r.ok) { location.href = '/'; }
      else { document.getElementById('err').textContent = 'Wrong password'; }
    });
  </script>
</body>
</html>
