name: keep-alive

# Keeps a free-tier openP6 instance from spinning down (Render sleeps after
# 15 minutes idle). Pings /healthz every 5 minutes.
#
# Replaces a third-party uptime service — no account needed.
# Configure the target once:  gh variable set OPENP6_URL --body "https://your-app.onrender.com"
#
# Note: GitHub only runs scheduled workflows from the default branch, and
# disables them after 60 days without repository activity.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          OPENP6_URL: ${{ vars.OPENP6_URL }}
        run: |
          if [ -z "$OPENP6_URL" ]; then
            echo "::warning::Repository variable OPENP6_URL is not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$OPENP6_URL/healthz" || echo 000)
          echo "GET $OPENP6_URL/healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::health endpoint returned $code"
            exit 1
          fi
